<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


    <nav>

        <div class="logo">
            AI Resume Analyzer
        </div>


        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/history">
                History
            </a>

        </div>

    </nav>



    <section class="hero">

        <h1>
            AI Resume Analyzer
        </h1>


        <p>
            Analyze your resume against a job description
            and discover your skill match.
        </p>

    </section>



    <div class="card">


        <form action="/analyze" method="POST" enctype="multipart/form-data">


            <label for="resume">
                Upload Resume
            </label>


            <input type="file" id="resume" name="resume" accept=".pdf" required>



            <label for="job_description">
                Job Description
            </label>


            <textarea id="job_description" name="job_description" rows="12"
                placeholder="Paste the job description here..." required></textarea>



            <button type="submit">
                Analyze Resume
            </button>


        </form>

    </div>


</body>

</html>
